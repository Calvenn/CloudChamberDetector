project:
  name: Cloud Chamber Particle Track Comparison
  random_seed: 42

paths:
  dataset_archive: dataset.zip
  source_dataset_root: dataset
  dataset_root: dataset/primary_dataset_split
  development_images: dataset/primary_dataset_split/development/images
  validation_images: dataset/primary_dataset_split/validation/images
  final_test_images: dataset/primary_dataset_split/final_test/images
  development_labels: dataset/primary_dataset_split/development/labels
  validation_labels: dataset/primary_dataset_split/validation/labels
  final_test_labels: dataset/primary_dataset_split/final_test/labels
  split_manifest: dataset/primary_dataset_split/manifest.csv
  coco_annotations: dataset/primary_dataset_split/annotations_coco.json
  raw_images: data/raw/images
  raw_videos: data/raw/videos
  extracted_frames: data/frames
  ground_truth_masks: data/ground_truth/masks
  annotations: data/ground_truth/annotations
  results: results

acquisition:
  frame_interval: 30
  jpeg_quality: 95
  excluded_folder_names:
    - Annotated
    - BW
  allowed_image_extensions:
    - .jpg
    - .jpeg
    - .png
    - .tif
    - .tiff
  allowed_video_extensions:
    - .mp4
    - .avi
    - .mov

enhancement:
  # Stronger smoothing suppresses fine granular chamber texture while a 7x7
  # kernel remains small relative to genuine long particle tracks.
  gaussian_kernel: 7
  gaussian_sigma: 1.4

segmentation:
  threshold_method: white_tophat_otsu
  # White top-hat is a morphological operation that suppresses slowly varying
  # background and preserves locally bright, thin structures.
  top_hat_kernel: 41
  # Selected with the kernel using pixel F1 on the validation masks only.
  threshold_offset: 4
  # Conservative lower-tail cut-offs measured from labelled Müller tracks.
  # Final contour filtering removes small/compact regions after closing.
  minimum_object_area: 80
  minimum_major_axis: 25
  minimum_thin_area: 90
  minimum_thin_perimeter: 40
  minimum_thin_major_axis: 17
  minimum_thin_aspect_ratio: 2.0
  # Closing is deliberately larger and runs first to join short breaks.
  closing_kernel: 15
  closing_iterations: 1
  # Opening is disabled so it cannot erase tracks only 1-2 pixels wide.
  # Small dots are removed by the contour size/shape rules above instead.
  apply_opening: false
  opening_kernel: 3
  opening_iterations: 1
  maximum_thin_frame_span: 0.85
  maximum_thin_frame_thickness: 0.025
  roi_profiles:
    external_muller:
      left: 0.0
      right: 0.0
      top: 0.0
      bottom: 0.0
      threshold_offset: 4
      closing_kernel: 15
      minimum_object_area: 80
      minimum_major_axis: 25
      enable_thin_track_rule: true
    primary_full_chamber:
      # Excludes the bright chamber walls in the fixed primary-camera layout.
      left: 0.06
      right: 0.06
      top: 0.07
      bottom: 0.12
      # Selected by one-to-one box F1 on the primary validation split.
      threshold_offset: 40
      closing_kernel: 3
      minimum_object_area: 200
      minimum_major_axis: 40
      # A second, stricter shape rule retains small but clearly elongated
      # fragments. Validation recovered 2 additional labelled tracks (11 -> 13)
      # with this rule; compact dots still fail the aspect/length requirements.
      enable_thin_track_rule: true
      minimum_thin_area: 150
      minimum_thin_perimeter: 70
      minimum_thin_major_axis: 30
      minimum_thin_aspect_ratio: 3.0

evaluation:
  mask_threshold: 127
  iou_match_threshold: 0.5

classification:
  supported_classes:
    - alpha
    - electron_positron
    - proton
  primary_dataset_classes:
    - alpha
    - electron_positron
