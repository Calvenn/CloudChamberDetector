project:
  name: Cloud Chamber Particle Track Comparison
  random_seed: 42

paths:
  dataset_archive: dataset.zip
  source_dataset_root: dataset
  dataset_root: dataset/primary_dataset_split
  development_images: dataset/primary_dataset_split/development/images
  validation_images: dataset/primary_dataset_split/validation/images
  final_test_images: dataset/primary_dataset_split/final_test/images
  development_labels: dataset/primary_dataset_split/development/labels
  validation_labels: dataset/primary_dataset_split/validation/labels
  final_test_labels: dataset/primary_dataset_split/final_test/labels
  split_manifest: dataset/primary_dataset_split/manifest.csv
  coco_annotations: dataset/primary_dataset_split/annotations_coco.json
  raw_images: data/raw/images
  raw_videos: data/raw/videos
  extracted_frames: data/frames
  ground_truth_masks: data/ground_truth/masks
  annotations: data/ground_truth/annotations
  results: results

acquisition:
  frame_interval: 30
  jpeg_quality: 95
  excluded_folder_names:
    - Annotated
    - BW
  allowed_image_extensions:
    - .jpg
    - .jpeg
    - .png
    - .tif
    - .tiff
  allowed_video_extensions:
    - .mp4
    - .avi
    - .mov

enhancement:
  # Stronger smoothing suppresses fine granular chamber texture while a 7x7
  # kernel remains small relative to genuine long particle tracks.
  gaussian_kernel: 7
  gaussian_sigma: 1.4

# The complete image is covered automatically by overlapping square tiles.
# Each processing copy is resized to this common resolution before enhancement.
spatial_scaling:
  tile_size: 800
  overlap_ratio: 0.15
  processing_width: 640
  processing_height: 640
  # Existing morphology and contour limits were validated at 1920 pixels.
  # They are proportionally converted to the ROI processing resolution.
  pixel_parameter_reference_size: 1920

segmentation:
  # Otsu supplies an image-adaptive baseline; two connected thresholds then
  # retain faint electron pixels only when they belong to a strong track seed.
  threshold_method: white_tophat_otsu_hysteresis
  # White top-hat kernel size: 121 at 1920 ref scale (scales to 41px at 640 res)
  # Large top-hat kernel prevents large white alpha blobs from being subtracted out!
  top_hat_kernel: 121
  # Hysteresis seed & low threshold offsets
  threshold_offset: 28
  # The weak threshold follows dim sections connected to a strong seed.
  hysteresis_low_threshold_offset: 0
  hysteresis_seed_pixels: 2
  # Keep the experimental directional recovery branch disabled: validation
  # showed that it merged nearby structures. Connected hysteresis remains on.
  thin_line_opening_length: 1
  thin_line_threshold_offset: 4
  # General rule: require substantial area for compact/general objects (e.g. green blobs / thick alpha).
  minimum_object_area: 1000
  minimum_major_axis: 80
  # Thin track rule: lowered aspect ratio (3.0) & length (45) to capture wavy/curved thin electron tracks
  enable_thin_track_rule: true
  minimum_thin_area: 80
  minimum_thin_perimeter: 60
  minimum_thin_major_axis: 45
  minimum_thin_aspect_ratio: 3.0
  # Small closing kernel preserves 1-2px electron track thinness for proper classification
  # Seven reference pixels scale to an effective 3x3 kernel at 640 px.
  closing_kernel: 7
  closing_iterations: 1
  directional_closing_length: 7
  # Use 1-pixel collinear alignment lines to bridge track gaps without thickening track width
  alignment_merge_gap: 180
  alignment_merge_angle: 30
  alignment_merge_minimum_aspect: 1.5
  prefilter_alignment_merge: true
  # Short fragments have less stable geometry than complete tracks. Permit
  # mildly elongated pieces to join, then apply the stricter 1.5 final rule.
  prefilter_alignment_minimum_aspect: 1.3
  # Opening is disabled so it cannot erase tracks only 1-2 pixels wide.
  apply_opening: false
  opening_kernel: 3
  opening_iterations: 1
  maximum_thin_frame_span: 0.85
  maximum_thin_frame_thickness: 0.05
  roi_profiles:
    external_muller:
      left: 0.0
      right: 0.0
      top: 0.0
      bottom: 0.0
      # Hysteresis: strong seed threshold (28) ignores fog; low threshold (6) preserves continuous track body
      threshold_offset: 28
      # 121 kernel preserves large white alpha blobs without erasing them
      top_hat_kernel: 121
      hysteresis_low_threshold_offset: 0
      hysteresis_seed_pixels: 2
      thin_line_opening_length: 1
      thin_line_threshold_offset: 4
      closing_kernel: 7
      directional_closing_length: 7
      alignment_merge_gap: 180
      alignment_merge_angle: 30
      alignment_merge_minimum_aspect: 1.5
      minimum_object_area: 1000
      minimum_major_axis: 80
      enable_thin_track_rule: true
      # Retains thin, faint, and curved electron tracks
      minimum_thin_area: 80
      minimum_thin_perimeter: 60
      minimum_thin_major_axis: 45
      minimum_thin_aspect_ratio: 3.0
    primary_full_chamber:
      left: 0.06
      right: 0.06
      top: 0.07
      bottom: 0.12
      # High seed threshold (55) to suppress dense background snow noise
      threshold_offset: 55
      top_hat_kernel: 61
      hysteresis_low_threshold_offset: 5
      hysteresis_seed_pixels: 3
      thin_line_opening_length: 1
      thin_line_threshold_offset: 10
      closing_kernel: 7
      directional_closing_length: 7
      alignment_merge_gap: 150
      alignment_merge_angle: 30
      alignment_merge_minimum_aspect: 1.5
      minimum_object_area: 1200
      minimum_major_axis: 100
      enable_thin_track_rule: true
      # Filters background static clusters while isolating genuine electron/positron track loops
      minimum_thin_area: 250
      minimum_thin_perimeter: 140
      minimum_thin_major_axis: 100
      minimum_thin_aspect_ratio: 3.5

evaluation:
  mask_threshold: 127
  iou_match_threshold: 0.5

classification:
  supported_classes:
    - alpha
    - electron_positron
    - proton
    # Müller semantic-mask channel 3. Keep it distinct from alpha; it is a
    # V-shaped track topology supplied as its own external-dataset class.
    - v_track
  primary_dataset_classes:
    - alpha
    - electron_positron
